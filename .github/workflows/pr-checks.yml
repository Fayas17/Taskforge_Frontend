name: PR Checks

on:
    pull_request:
        branches: [master]
        types: [opened, edited, synchronize, reopened]

jobs:
    pr-title:
        name: Validate PR Title
        runs-on: ubuntu-latest
        steps:
            - name: Check PR title follows conventional commits
              uses: amannn/action-semantic-pull-request@v5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      chore
                      refactor
                      test
                      docs
                      style
                      perf
                  requireScope: false

    branch-name:
        name: Validate Branch Name
        runs-on: ubuntu-latest
        steps:
            - name: Check branch name convention
              run: |
                  BRANCH="${{ github.head_ref }}"
                  echo "Branch: $BRANCH"

                  # Branches created before the naming convention was introduced.
                  # Do not add new entries here — use feat/<description> going forward.
                  LEGACY_BRANCHES=("authentication")
                  for legacy in "${LEGACY_BRANCHES[@]}"; do
                    if [[ "$BRANCH" == "$legacy" ]]; then
                      echo "Branch '$BRANCH' is a pre-convention legacy branch — skipping name check."
                      exit 0
                    fi
                  done

                  if [[ "$BRANCH" =~ ^(feat|fix|chore|refactor|test|docs)/.+ ]]; then
                    echo "Branch name is valid."
                  else
                    echo "Branch name '$BRANCH' does not follow the convention."
                    echo "Expected format: feat/<description>, fix/<description>, chore/<description>, etc."
                    exit 1
                  fi
